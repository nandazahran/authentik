# docker-compose.override.yml
# Docker Compose merges this file automatically with the official
# docker-compose.yml from Authentik (same directory), so the official
# file stays untouched.
#
# NOTE: the service name "server" below must match the official file.
# TODO: pin image versions (avoid :latest) before using this beyond a demo.

services:
  # Reverse proxy: HTTPS entry point + forward-auth gatekeeper
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # Blueprint demo: di-mount ke /blueprints/custom/ pada server+worker
  # (subdirektori custom, bukan menimpa /blueprints; packaged defaults tetap).
  # Worker auto-discovery menerapkannya. Tag !Env di blueprint.yaml membaca
  # environment server/worker, yang datang dari .env lewat interpolasi Compose.
  server:
    volumes:
      - ./blueprint.yaml:/blueprints/custom/demo.yaml:ro
    environment:
      AUTH_PUBLIC_HOST: ${AUTH_PUBLIC_HOST:-}
      TOOLS_PUBLIC_HOST: ${TOOLS_PUBLIC_HOST:-}
      POZNOTE_PUBLIC_HOST: ${POZNOTE_PUBLIC_HOST:-}
      POZNOTE_OIDC_CLIENT_ID: ${POZNOTE_OIDC_CLIENT_ID:-}
      POZNOTE_OIDC_CLIENT_SECRET: ${POZNOTE_OIDC_CLIENT_SECRET:-}

  worker:
    volumes:
      - ./blueprint.yaml:/blueprints/custom/demo.yaml:ro
    environment:
      AUTH_PUBLIC_HOST: ${AUTH_PUBLIC_HOST:-}
      TOOLS_PUBLIC_HOST: ${TOOLS_PUBLIC_HOST:-}
      POZNOTE_PUBLIC_HOST: ${POZNOTE_PUBLIC_HOST:-}
      POZNOTE_OIDC_CLIENT_ID: ${POZNOTE_OIDC_CLIENT_ID:-}
      POZNOTE_OIDC_CLIENT_SECRET: ${POZNOTE_OIDC_CLIENT_SECRET:-}

  # Demo app 1: static developer tools, no login of its own -> forward auth
  it-tools:
    image: corentinth/it-tools:latest
    restart: unless-stopped

  # Demo app 2: lightweight notes app with per-user accounts -> OIDC
  poznote:
    image: ghcr.io/timothepoznanski/poznote:latest
    restart: unless-stopped
    volumes:
      # Target HARUS /var/www/html/data (bukan /app/data): itu lokasi data
      # Poznote sesuai upstream docker-compose.yml + Dockerfile-nya.
      - poznote_data:/var/www/html/data
    environment:
      # Diisi di .env setelah provider OAuth2 dibuat di Authentik.
      # Kosong diperbolehkan sebelum OIDC dikonfigurasi.
      POZNOTE_OIDC_CLIENT_ID: ${POZNOTE_OIDC_CLIENT_ID:-}
      POZNOTE_OIDC_CLIENT_SECRET: ${POZNOTE_OIDC_CLIENT_SECRET:-}

volumes:
  caddy_data:
  caddy_config:
  poznote_data:
