# docker-compose.override.yml
# Docker Compose merges this file automatically with the official
# docker-compose.yml from Authentik (same directory), so the official
# file stays untouched.
#
# NOTE: the service name "server" below must match the official file.
# Authentik server/worker are NOT declared here: they come from the official
# compose.yml, whose image tag is pinned via AUTHENTIK_TAG in .env (written by
# setup.sh). See "Menaikkan versi Authentik" in README.md.
# The images below are third-party demo apps without managed schema; :latest
# is tolerable for them because an upgrade cannot break authentik migrations.

services:
  # Reverse proxy: HTTPS entry point + forward-auth gatekeeper
  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  # CATATAN BLUEPRINT: mount blueprint.yaml TIDAK ada di file bersama ini.
  # Mount hanya aktif bila overlay docker-compose.blueprint.yml ada di
  # COMPOSE_FILE. File itu ditulis otomatis oleh setup.sh (opt-in). Penyedia
  # yang dikonfigurasi manual lewat UI tidak akan pernah ditimpa blueprint.

  # Demo app 1: static developer tools, no login of its own -> forward auth
  it-tools:
    image: docker.io/corentinth/it-tools:latest
    restart: unless-stopped

  # Demo app 2: lightweight notes app with per-user accounts -> OIDC
  poznote:
    image: ghcr.io/timothepoznanski/poznote:latest
    restart: unless-stopped
    volumes:
      # Mount target: Poznote stores data at /var/www/html/data per upstream
      # docker-compose.yml + Dockerfile.
      - poznote_data:/var/www/html/data
    environment:
      # Diisi di .env setelah provider OAuth2 dibuat di Authentik.
      # Kosong diperbolehkan sebelum OIDC dikonfigurasi.
      POZNOTE_OIDC_CLIENT_ID: ${POZNOTE_OIDC_CLIENT_ID:-}
      POZNOTE_OIDC_CLIENT_SECRET: ${POZNOTE_OIDC_CLIENT_SECRET:-}

volumes:
  caddy_data:
  caddy_config:
  poznote_data:
